[project]
name = "cfdna-methylation-lod"
version = "0.1.0"
description = "Detection limits of cfDNA methylation deconvolution: from Moss et al. 2018 arrays to MRD-level fractions"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow>=16,<18",
  "scipy",
  "scikit-learn",
  "xgboost>=2.0,<2.1",
  "matplotlib",
  "openpyxl",
  "requests",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.uv]
# The cluster runs glibc 2.27; only accept prebuilt manylinux2014 wheels.
no-build = true

[tool.pytest.ini_options]
pythonpath = ["."]
